name: Verify RugShield

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile contract sources
        run: python -m compileall -q rugshield.py contracts/rugshield.py

      - name: Run integrity tests
        run: python -m unittest discover -s tests -v

      - name: Verify published release
        run: python scripts/verify_release.py
