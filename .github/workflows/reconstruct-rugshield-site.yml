name: Reconstruct RugShield website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact website snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cat .rugshield-site/site.part*.b64 | base64 -d | gzip -dc > site/index.html
          echo "930ee8fa9a269f17f8ffad69635c76e0a72b003ee1a0ba5efde3fe5149486111  site/index.html" | sha256sum -c -
          rm -rf .rugshield-site
          rm -f .github/workflows/reconstruct-rugshield-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add exact RugShield website snapshot"
          git push
